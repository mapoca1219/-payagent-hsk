<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente del Icono -->
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <!-- Resplandor Neón -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICONO (Hexágono de Escrow & AI) -->
  <g transform="translate(20, 10)">
    <!-- Base Hexagonal Exterior -->
    <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" 
             fill="#0f172a" stroke="url(#cyberGradient)" stroke-width="3.5" filter="url(#glow)"/>
    
    <!-- Anillo de Enlace de Red (Circuito Interno) -->
    <circle cx="50" cy="50" r="22" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
    
    <!-- Núcleo de Pago Autónomo (Escrow / AI Core) -->
    <polygon points="50,32 64,41 64,59 50,68 36,59 36,41" 
             fill="url(#cyberGradient)"/>
    
    <!-- Chispa de Autonomía (Sparkle central) -->
    <circle cx="50" cy="50" r="4.5" fill="#ffffff" />
    <path d="M50 20 L50 26 M50 74 L50 80 M24 35 L29 38 M71 62 L76 65" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- TIPOGRAFÍA Y MARCA -->
  <text x="135" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#f8fafc" letter-spacing="-0.5">
    PayAgent
  </text>
  <text x="312" y="62" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="900" font-size="38" fill="#06b6d4" letter-spacing="1">
    HSK
  </text>
  
  <!-- TAGLINE DE VALOR -->
  <text x="137" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" letter-spacing="0.8">
    AUTONOMOUS x402 ESCROW &amp; PHYSICAL DVP
  </text>
  
  <!-- BADGE INSTITUCIONAL -->
  <rect x="137" y="94" width="168" height="16" rx="4" fill="#022c22" stroke="#10b981" stroke-width="0.8" opacity="0.9"/>
  <text x="145" y="106" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399">
    ● HASHKEY CHAIN L2 (133)
  </text>
</svg>
